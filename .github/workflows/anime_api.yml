name: Anime API Engine

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action type (search or watch)'
        required: true
        default: 'search'
      query:
        description: 'Anime name for search'
        required: false
      slug:
        description: 'Anime slug'
        required: false
      episode:
        description: 'Episode number'
        required: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone ani-cli-arabic & Install Dependencies
        run: |
          # استنساخ المستودع الجاهز بالكامل
          git clone https://github.com/np4abdou1/ani-cli-arabic.git ani_engine
          cd ani_engine
          
          # تثبيت متطلبات المشروع إن وجدت
          if [ -f "requirements.txt" ]; then
              pip install -r requirements.txt
          else
              pip install curl_cffi beautifulsoup4 playwright
          fi
          
          playwright install chromium || true

      - name: Execute ani-cli-arabic Script Directly
        env:
          ACTION_TYPE: ${{ github.event.inputs.action }}
          QUERY: ${{ github.event.inputs.query }}
          SLUG: ${{ github.event.inputs.slug }}
          EPISODE: ${{ github.event.inputs.episode }}
        run: |
          python -c "
          import os
          import sys
          import subprocess
          import glob

          # الانتقال لمجلد المشروع المستنسخ
          os.chdir('ani_engine')
          sys.path.insert(0, os.getcwd())

          action = os.getenv('ACTION_TYPE')
          query = os.getenv('QUERY', '')
          slug = os.getenv('SLUG', '')
          episode = os.getenv('EPISODE', '1')

          output = ''

          try:
              # البحث عن السكربت الرئيسي داخل المستودع الجاهز
              py_files = [f for f in glob.glob('*.py') if f not in ['__init__.py']]
              print(f'Discovered Python scripts: {py_files}')

              target_script = None
              for f in py_files:
                  if 'main' in f.lower() or 'cli' in f.lower() or 'run' in f.lower() or len(py_files) == 1:
                      target_script = f
                      break
              if not target_script and py_files:
                  target_script = py_files[0]

              if target_script:
                  if action == 'search':
                      print(f'Running search via {target_script} for: {query}')
                      res = subprocess.run(
                          [sys.executable, target_script, '--search', query],
                          capture_output=True, text=True, timeout=40
                      )
                      output = res.stdout if res.stdout.strip() else res.stderr
                  elif action == 'watch':
                      print(f'Running watch via {target_script} for slug: {slug}, ep: {episode}')
                      res = subprocess.run(
                          [sys.executable, target_script, '--slug', slug, '--episode', str(episode)],
                          capture_output=True, text=True, timeout=40
                      )
                      output = res.stdout if res.stdout.strip() else res.stderr
              else:
                  output = 'ERROR: No executable python script found in ani-cli-arabic'

          except Exception as e:
              output = f'ERROR: {str(e)}'

          # العودة للمجلد الرئيسي وحفظ النتيجة
          os.chdir('..')
          with open('api_result.txt', 'w', encoding='utf-8') as f:
              f.write(output.strip())
          "

      - name: Commit and Push Result
        run: |
          git config --global user.name 'Anime Bot'
          git config --global user.email 'bot@github.com'
          git add api_result.txt
          git commit -m "Execute official ani-cli-arabic ready script" || exit 0
          git push
