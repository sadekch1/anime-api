name: Anime API Engine

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action type (search or watch)'
        required: true
        default: 'search'
      query:
        description: 'Anime name for search'
        required: false
      slug:
        description: 'Anime slug'
        required: false
      episode:
        description: 'Episode number'
        required: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install curl_cffi beautifulsoup4

      - name: Run Fast Scraper with TLS Impersonation
        env:
          ACTION_TYPE: ${{ github.event.inputs.action }}
          QUERY: ${{ github.event.inputs.query }}
          SLUG: ${{ github.event.inputs.slug }}
          EPISODE: ${{ github.event.inputs.episode }}
        run: |
          python -c "
          import os
          import urllib.parse
          import re
          from curl_cffi import requests
          from bs4 import BeautifulSoup

          action = os.getenv('ACTION_TYPE')
          result = ''

          if action == 'search':
              query = os.getenv('QUERY', '')
              search_url = f'https://animeblkom.net/search?query={urllib.parse.quote(query)}'
              print(f'=== Requesting: {search_url} ===')
              try:
                  # محاكاة بصمة متصفح كروم الحقيقي لتجاوز Cloudflare فوراً
                  response = requests.get(search_url, impersonate='chrome120', timeout=30)
                  print(f'Status Code: {response.status_code}')
                  
                  if 'cloudflare' in response.text.lower() and 'verify' in response.text.lower():
                      result = 'CF_BLOCKED | موقع AnimeBlkom يحتاج تحقق بشري'
                  else:
                      soup = BeautifulSoup(response.text, 'html.parser')
                      links = []
                      
                      # استخراج الروابط الخاصة بالأنمي
                      for a in soup.find_all('a', href=True):
                          href = a['href']
                          text = a.get_text(strip=True)
                          if ('/anime/' in href or '/show/' in href) and len(text) > 1:
                              parts = [p for p in href.split('/') if p]
                              if len(parts) >= 2 and parts[-1] != 'anime':
                                  slug = parts[-1]
                                  links.append(f'{slug} | {text}')
                      
                      unique_links = list(dict.fromkeys(links))
                      if unique_links:
                          result = '\n'.join(unique_links[:40])
                      else:
                          # احتياطي: جلب العناوين في الصفحة إن لم يجد روابط مباشرة
                          titles = [t.get_text(strip=True) for t in soup.find_all(['h2', 'h3', 'a']) if len(t.get_text(strip=True)) > 2]
                          result = '\n'.join([f'item | {t}' for t in list(set(titles))[:30]])
                          if not result:
                              result = 'NO_RESULTS_FOUND'
              except Exception as e:
                  result = f'ERROR: {str(e)}'

          elif action == 'watch':
              slug = os.getenv('SLUG', '')
              episode = os.getenv('EPISODE', '1')
              watch_url = f'https://animeblkom.net/watch/{slug}/{episode}'
              print(f'=== Fetching Watch: {watch_url} ===')
              try:
                  response = requests.get(watch_url, impersonate='chrome120', timeout=30)
                  
                  bk_links = re.findall(r'https?://[^\s\"\'<>]+bkvideo[^\s\"\'<>]+', response.text)
                  if not bk_links:
                      bk_links = re.findall(r'https?://[^\s\"\'<>:]+\.mp4[^\s\"\'<>]*', response.text)
                      
                  unique_streams = list(set(bk_links))
                  if unique_streams:
                      result = '\n'.join(unique_streams)
                  else:
                      result = 'NO_STREAMS_FOUND'
              except Exception as e:
                  result = f'ERROR: {str(e)}'

          with open('api_result.txt', 'w', encoding='utf-8') as f:
              f.write(result.strip())
          "

      - name: Commit and Push Result
        run: |
          git config --global user.name 'Anime Bot'
          git config --global user.email 'bot@github.com'
          git add api_result.txt
          git commit -m "Update API result with curl_cffi" || exit 0
          git push
