name: Anime API Engine

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action type (search or watch)'
        required: true
        default: 'search'
      query:
        description: 'Anime name for search'
        required: false
      slug:
        description: 'Anime slug'
        required: false
      episode:
        description: 'Episode number'
        required: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run Scraper Engine with Debug
        env:
          ACTION_TYPE: ${{ github.event.inputs.action }}
          QUERY: ${{ github.event.inputs.query }}
          SLUG: ${{ github.event.inputs.slug }}
          EPISODE: ${{ github.event.inputs.episode }}
        run: |
          python -c "
          import os
          import urllib.parse
          import re
          from playwright.sync_api import sync_playwright

          action = os.getenv('ACTION_TYPE')
          result = ''

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--no-sandbox', '--disable-setuid-sandbox'])
              context = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36',
                  viewport={'width': 1280, 'height': 720}
              )
              page = context.new_page()

              if action == 'search':
                  query = os.getenv('QUERY', '')
                  search_url = f'https://animeblkom.net/search?query={urllib.parse.quote(query)}'
                  print(f'=== DEBUG: Searching URL: {search_url} ===')
                  try:
                      response = page.goto(search_url, wait_until='domcontentloaded', timeout=60000)
                      print(f'=== DEBUG: HTTP Status: {response.status if response else \"None\"} ===')
                      print(f'=== DEBUG: Page Title: {page.title()} ===')
                      
                      page.wait_for_timeout(6000)
                      
                      # فحص ما إذا كانت الصفحة تحتوي على حماية Cloudflare أو تحدي
                      page_text = page.inner_text('body')
                      if 'cloudflare' in page_text.lower() or 'ddos-guard' in page_text.lower():
                          result = 'CF_BLOCKED | موقع AnimeBlkom يمنع السيرفر (Cloudflare Block)'
                      else:
                          links = []
                          # البحث عن أي عناصر تحتوي على روابط أنمي أو حلقات
                          elements = page.query_selector_all('a')
                          print(f'=== DEBUG: Total <a> tags found: {len(elements)} ===')
                          
                          for el in elements:
                              href = el.get_attribute('href') or ''
                              text = el.inner_text().strip()
                              if href and len(text) > 1:
                                  # حفظ أي رابط مفيد مع عنوانه لنتمكن من رؤيته
                                  links.append(f'{href} | {text}')
                          
                          unique_links = list(dict.fromkeys(links))
                          if unique_links:
                              # نعرض أول 40 نتيجة مباشرة في ملف التشخيص
                              result = '\n'.join(unique_links[:40])
                          else:
                              result = f'NO_LINKS_FOUND | Page Title: {page.title()} | Content preview: {page_text[:100]}'
                  except Exception as e:
                      result = f'ERROR: {str(e)}'

              elif action == 'watch':
                  slug = os.getenv('SLUG', '')
                  episode = os.getenv('EPISODE', '1')
                  watch_url = f'https://animeblkom.net/watch/{slug}/{episode}'
                  print(f'=== DEBUG Watch URL: {watch_url} ===')
                  try:
                      page.goto(watch_url, wait_until='domcontentloaded', timeout=60000)
                      page.wait_for_timeout(5000)
                      content = page.content()
                      
                      bk_links = re.findall(r'https?://[^\s\"\'<>]+bkvideo[^\s\"\'<>]+', content)
                      if not bk_links:
                          bk_links = re.findall(r'https?://[^\s\"\'<>:]+\.mp4[^\s\"\'<>]*', content)
                          
                      unique_streams = list(set(bk_links))
                      if unique_streams:
                          result = '\n'.join(unique_streams)
                      else:
                          result = f'NO_STREAMS | HTML snippet: {content[:200]}'
                  except Exception as e:
                      result = f'ERROR: {str(e)}'

              browser.close()

          with open('api_result.txt', 'w', encoding='utf-8') as f:
              f.write(result.strip())
          "

      - name: Commit and Push Result
        run: |
          git config --global user.name 'Anime Bot'
          git config --global user.email 'bot@github.com'
          git add api_result.txt
          git commit -m "Update Debug API result" || exit 0
          git push
