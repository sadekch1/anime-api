name: Anime API Engine

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action type (search or watch)'
        required: true
        default: 'search'
      query:
        description: 'Anime name for search'
        required: false
      slug:
        description: 'Anime slug'
        required: false
      episode:
        description: 'Episode number'
        required: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install curl_cffi beautifulsoup4

      - name: Run Engine with Session Handling
        env:
          ACTION_TYPE: ${{ github.event.inputs.action }}
          QUERY: ${{ github.event.inputs.query }}
          SLUG: ${{ github.event.inputs.slug }}
          EPISODE: ${{ github.event.inputs.episode }}
        run: |
          python -c "
          import os
          import traceback
          import urllib.parse
          import re
          import time
          from curl_cffi import requests
          from bs4 import BeautifulSoup

          debug_logs = []
          def log(msg):
              print(msg)
              debug_logs.append(str(msg))

          action = os.getenv('ACTION_TYPE')
          result = ''

          try:
              # استخدام Session لحفظ الكوكيز وتجاوز Cloudflare Redirects
              session = requests.Session()

              if action == 'search':
                  query = os.getenv('QUERY', '')
                  log(f'=== Starting search for query: {query} ===')
                  links = []
                  
                  search_queries = [
                      f'animeblkom {query}',
                      f'انمي بالكوم {query}'
                  ]
                  
                  for sq in search_queries:
                      ddg_url = f'https://html.duckduckgo.com/html/?q={urllib.parse.quote(sq)}'
                      log(f'Trying DDG: {ddg_url}')
                      try:
                          resp = session.get(ddg_url, impersonate='chrome120', timeout=30)
                          soup = BeautifulSoup(resp.text, 'html.parser')
                          for a in soup.find_all('a', href=True):
                              href = a['href']
                              real_url = href
                              if 'uddg=' in href:
                                  try:
                                      parsed_q = urllib.parse.parse_qs(urllib.parse.urlparse(href).query)
                                      if 'uddg' in parsed_q:
                                          real_url = parsed_q['uddg'][0]
                                  except:
                                      pass
                              
                              if 'animeblkom.net' in real_url:
                                  parts = [p for p in real_url.split('/') if p]
                                  if len(parts) >= 2:
                                      slug = parts[-1]
                                      text = a.get_text(strip=True)
                                      if slug and slug != 'anime' and slug != 'show':
                                          links.append(f'{slug} | {text or slug}')
                      except Exception as e:
                          log(f'DDG Error: {traceback.format_exc()}')

                  unique_links = list(dict.fromkeys(links))
                  log(f'Total unique links found: {len(unique_links)}')
                  
                  if unique_links:
                      result = '\n'.join(unique_links[:40])
                  else:
                      result = 'NO_RESULTS_FOUND'

              elif action == 'watch':
                  slug = os.getenv('SLUG', '')
                  episode = os.getenv('EPISODE', '1')
                  watch_url = f'https://animeblkom.net/watch/{slug}/{episode}'
                  log(f'Fetching Watch URL with Session: {watch_url}')
                  
                  # زيارة الصفحة الرئيسية أولاً لجلب كوكيز Cloudflare الأساسية
                  session.get('https://animeblkom.net/', impersonate='chrome120', timeout=30)
                  time.sleep(2) # مهلة قصيرة لإنهاء التحقق
                  
                  resp = session.get(watch_url, impersonate='chrome120', timeout=30)
                  log(f'Watch Status Code: {resp.status_code}')
                  log(f'Response snippet: {resp.text[:300]}')
                  
                  bk_links = re.findall(r'https?://[^\s\"\'<>]+bkvideo[^\s\"\'<>]+', resp.text)
                  if not bk_links:
                      bk_links = re.findall(r'https?://[^\s\"\'<>:]+\.mp4[^\s\"\'<>]*', resp.text)
                      
                  unique_streams = list(set(bk_links))
                  log(f'Found streams: {unique_streams}')
                  if unique_streams:
                      result = '\n'.join(unique_streams)
                  else:
                      result = 'NO_STREAMS_FOUND'

          except Exception as e:
              err_msg = traceback.format_exc()
              log(f'CRITICAL ERROR: {err_msg}')
              result = f'ERROR: {str(e)}'

          with open('api_result.txt', 'w', encoding='utf-8') as f:
              f.write(result.strip())

          with open('debug.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(debug_logs))
          "

      - name: Commit and Push Result and Debug Logs
        run: |
          git config --global user.name 'Anime Bot'
          git config --global user.email 'bot@github.com'
          git add api_result.txt debug.txt
          git commit -m "Update watch engine with Session and cookies" || exit 0
          git push
