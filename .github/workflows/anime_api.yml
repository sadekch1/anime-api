name: Anime API Engine

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action type (search or watch)'
        required: true
        default: 'search'
      query:
        description: 'Anime name for search'
        required: false
      slug:
        description: 'Anime slug'
        required: false
      episode:
        description: 'Episode number'
        required: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install duckduckgo_search curl_cffi beautifulsoup4

      - name: Run Official DDGS Search
        env:
          ACTION_TYPE: ${{ github.event.inputs.action }}
          QUERY: ${{ github.event.inputs.query }}
          SLUG: ${{ github.event.inputs.slug }}
          EPISODE: ${{ github.event.inputs.episode }}
        run: |
          python -c "
          import os
          import re
          from duckduckgo_search import DDGS
          from curl_cffi import requests
          from bs4 import BeautifulSoup

          action = os.getenv('ACTION_TYPE')
          result = ''

          if action == 'search':
              query = os.getenv('QUERY', '')
              print(f'=== Searching via DDGS for: {query} ===')
              links = []
              try:
                  with DDGS() as ddgs:
                      # البحث المباشر عبر مكتبة DDGS المخصصة
                      for r in ddgs.text(f'site:animeblkom.net {query}', max_results=15):
                          href = r.get('href', '')
                          title = r.get('title', '')
                          
                          match = re.search(r'animeblkom\.net/(?:anime|show)/([^/?#]+)', href)
                          if match:
                              slug = match.group(1)
                              if slug and slug != 'anime':
                                  links.append(f'{slug} | {title or slug}')
                  
                  unique_links = list(dict.fromkeys(links))
                  if unique_links:
                      result = '\n'.join(unique_links[:30])
                  else:
                      result = 'NO_RESULTS_FOUND'
              except Exception as e:
                  result = f'ERROR: {str(e)}'

          elif action == 'watch':
              slug = os.getenv('SLUG', '')
              episode = os.getenv('EPISODE', '1')
              watch_url = f'https://animeblkom.net/watch/{slug}/{episode}'
              print(f'=== Fetching Watch: {watch_url} ===')
              try:
                  response = requests.get(watch_url, impersonate='chrome120', timeout=30)
                  
                  bk_links = re.findall(r'https?://[^\s\"\'<>]+bkvideo[^\s\"\'<>]+', response.text)
                  if not bk_links:
                      bk_links = re.findall(r'https?://[^\s\"\'<>:]+\.mp4[^\s\"\'<>]*', response.text)
                      
                  unique_streams = list(set(bk_links))
                  if unique_streams:
                      result = '\n'.join(unique_streams)
                  else:
                      result = 'NO_STREAMS_FOUND'
              except Exception as e:
                  result = f'ERROR: {str(e)}'

          with open('api_result.txt', 'w', encoding='utf-8') as f:
              f.write(result.strip())
          "

      - name: Commit and Push Result
        run: |
          git config --global user.name 'Anime Bot'
          git config --global user.email 'bot@github.com'
          git add api_result.txt
          git commit -m "Update API result via DDGS" || exit 0
          git push
