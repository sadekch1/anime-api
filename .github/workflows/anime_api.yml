name: Anime API Engine

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action type (search or watch)'
        required: true
        default: 'search'
      query:
        description: 'Anime name for search'
        required: false
      slug:
        description: 'Anime slug'
        required: false
      episode:
        description: 'Episode number'
        required: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright & Stealth
        run: |
          pip install playwright playwright-stealth
          playwright install chromium
          playwright install-deps chromium

      - name: Run Playwright Stealth Engine
        env:
          ACTION_TYPE: ${{ github.event.inputs.action }}
          QUERY: ${{ github.event.inputs.query }}
          SLUG: ${{ github.event.inputs.slug }}
          EPISODE: ${{ github.event.inputs.episode }}
        run: |
          python -c "
          import os
          import traceback
          import urllib.parse
          import re
          from playwright.sync_api import sync_playwright
          from playwright_stealth import stealth_sync

          action = os.getenv('ACTION_TYPE')
          result = ''

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          '--no-sandbox',
                          '--disable-setuid-sandbox',
                          '--disable-blink-features=AutomationControlled'
                      ]
                  )
                  context = browser.new_context(
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36',
                      viewport={'width': 1280, 'height': 800},
                      locale='ar-SA'
                  )
                  page = context.new_page()
                  stealth_sync(page)

                  if action == 'search':
                      query = os.getenv('QUERY', '')
                      print(f'Searching for: {query}')
                      links = []
                      
                      search_queries = [
                          f'https://html.duckduckgo.com/html/?q={urllib.parse.quote(f\"animeblkom {query}\")}',
                          f'https://html.duckduckgo.com/html/?q={urllib.parse.quote(f\"انمي بالكوم {query}\")}'
                      ]
                      
                      for sq in search_queries:
                          try:
                              page.goto(sq, timeout=30000)
                              page.wait_for_timeout(3000)
                              
                              for a in page.query_selector_all('a'):
                                  href = a.get_attribute('href') or ''
                                  real_url = href
                                  if 'uddg=' in href:
                                      try:
                                          parsed_q = urllib.parse.parse_qs(urllib.parse.urlparse(href).query)
                                          if 'uddg' in parsed_q:
                                              real_url = parsed_q['uddg'][0]
                                      except:
                                          pass
                                  
                                  if 'animeblkom.net' in real_url:
                                      parts = [p for p in real_url.split('/') if p]
                                      if len(parts) >= 2:
                                          slug = parts[-1]
                                          text = a.inner_text().strip()
                                          if slug and slug != 'anime' and slug != 'show':
                                              links.append(f'{slug} | {text or slug}')
                          except Exception as e:
                              print(f'Search error: {e}')

                      unique_links = list(dict.fromkeys(links))
                      if unique_links:
                          result = '\n'.join(unique_links[:40])
                      else:
                          result = 'NO_RESULTS_FOUND'

                  elif action == 'watch':
                      slug = os.getenv('SLUG', '')
                      episode = os.getenv('EPISODE', '1')
                      watch_url = f'https://animeblkom.net/watch/{slug}/{episode}'
                      print(f'Fetching Watch URL with Playwright: {watch_url}')
                      
                      # الانتقال للصفحة مع منح وقت كافٍ لتجاوز تحدي Cloudflare JS تلقائياً
                      page.goto(watch_url, timeout=60000)
                      
                      # الانتظار الذكي حتى يتم حل التحدي وتحميل محتوى الصفحة الحقيقي
                      for _ in range(10):
                          content = page.content()
                          if '__cf_chl_jschl_tk__' not in content and 'Checking your browser' not in content:
                              break
                          page.wait_for_timeout(2000)
                      
                      content = page.content()
                      
                      # استخراج روابط التشغيل المباشرة
                      bk_links = re.findall(r'https?://[^\s\"\'<>]+bkvideo[^\s\"\'<>]+', content)
                      if not bk_links:
                          bk_links = re.findall(r'https?://[^\s\"\'<>:]+\.mp4[^\s\"\'<>]*', content)
                          
                      unique_streams = list(set(bk_links))
                      if unique_streams:
                          result = '\n'.join(unique_streams)
                      else:
                          result = 'NO_STREAMS_FOUND'

                  browser.close()

          except Exception as e:
              result = f'ERROR: {str(e)}'

          with open('api_result.txt', 'w', encoding='utf-8') as f:
              f.write(result.strip())
          "

      - name: Commit and Push Result
        run: |
          git config --global user.name 'Anime Bot'
          git config --global user.email 'bot@github.com'
          git add api_result.txt
          git commit -m "Update watch engine with Playwright Stealth" || exit 0
          git push
