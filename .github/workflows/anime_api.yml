name: Anime API Engine

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action type (search or watch)'
        required: true
        default: 'search'
      query:
        description: 'Anime name for search'
        required: false
      slug:
        description: 'Anime slug'
        required: false
      episode:
        description: 'Episode number'
        required: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install curl_cffi beautifulsoup4

      - name: Run DDG Smart Parser
        env:
          ACTION_TYPE: ${{ github.event.inputs.action }}
          QUERY: ${{ github.event.inputs.query }}
          SLUG: ${{ github.event.inputs.slug }}
          EPISODE: ${{ github.event.inputs.episode }}
        run: |
          python -c "
          import os
          import urllib.parse
          import re
          from curl_cffi import requests
          from bs4 import BeautifulSoup

          action = os.getenv('ACTION_TYPE')
          result = ''

          if action == 'search':
              query = os.getenv('QUERY', '')
              ddg_url = f'https://html.duckduckgo.com/html/?q={urllib.parse.quote(f\"site:animeblkom.net {query}\")}'
              print(f'=== DDG Search: {ddg_url} ===')
              try:
                  response = requests.get(ddg_url, impersonate='chrome120', timeout=30)
                  soup = BeautifulSoup(response.text, 'html.parser')
                  
                  links = []
                  for a in soup.find_all('a', href=True):
                      href = a['href']
                      real_url = href
                      
                      # فك تشفير رابط إعادة توجيه DuckDuckGo (uddg)
                      if 'uddg=' in href:
                          try:
                              parsed_q = urllib.parse.parse_qs(urllib.parse.urlparse(href).query)
                              if 'uddg' in parsed_q:
                                  real_url = parsed_q['uddg'][0]
                          except:
                              pass
                      
                      # التحقق مما إذا كان الرابط يخص موقع أنمي بالكوم
                      if 'animeblkom.net' in real_url:
                          match = re.search(r'animeblkom\.net/(?:anime|show)/([^/?#]+)', real_url)
                          if match:
                              slug = match.group(1)
                              text = a.get_text(strip=True)
                              if slug and slug != 'anime':
                                  links.append(f'{slug} | {text or slug}')
                  
                  unique_links = list(dict.fromkeys(links))
                  if unique_links:
                      result = '\n'.join(unique_links[:40])
                  else:
                      result = 'NO_RESULTS_FOUND'
              except Exception as e:
                  result = f'ERROR: {str(e)}'

          elif action == 'watch':
              slug = os.getenv('SLUG', '')
              episode = os.getenv('EPISODE', '1')
              watch_url = f'https://animeblkom.net/watch/{slug}/{episode}'
              print(f'=== Fetching Watch: {watch_url} ===')
              try:
                  response = requests.get(watch_url, impersonate='chrome120', timeout=30)
                  
                  bk_links = re.findall(r'https?://[^\s\"\'<>]+bkvideo[^\s\"\'<>]+', response.text)
                  if not bk_links:
                      bk_links = re.findall(r'https?://[^\s\"\'<>:]+\.mp4[^\s\"\'<>]*', response.text)
                      
                  unique_streams = list(set(bk_links))
                  if unique_streams:
                      result = '\n'.join(unique_streams)
                  else:
                      result = 'NO_STREAMS_FOUND'
              except Exception as e:
                  result = f'ERROR: {str(e)}'

          with open('api_result.txt', 'w', encoding='utf-8') as f:
              f.write(result.strip())
          "

      - name: Commit and Push Result
        run: |
          git config --global user.name 'Anime Bot'
          git config --global user.email 'bot@github.com'
          git add api_result.txt
          git commit -m "Update API result with DDG decoder" || exit 0
          git push
