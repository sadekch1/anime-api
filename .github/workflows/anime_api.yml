name: Anime API Engine

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action type (search or watch)'
        required: true
        default: 'search'
      query:
        description: 'Anime name for search'
        required: false
      slug:
        description: 'Anime slug'
        required: false
      episode:
        description: 'Episode number'
        required: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright & Stealth
        run: |
          pip install playwright playwright-stealth
          playwright install chromium
          playwright install-deps chromium

      - name: Run Scraper Engine with Stealth
        env:
          ACTION_TYPE: ${{ github.event.inputs.action }}
          QUERY: ${{ github.event.inputs.query }}
          SLUG: ${{ github.event.inputs.slug }}
          EPISODE: ${{ github.event.inputs.episode }}
        run: |
          python -c "
          import os
          import urllib.parse
          import re
          from playwright.sync_api import sync_playwright
          from playwright_stealth import stealth_sync

          action = os.getenv('ACTION_TYPE')
          result = ''

          with sync_playwright() as p:
              # تشغيل المتصفح مع إزالة علامات الأتمتة
              browser = p.chromium.launch(
                  headless=True, 
                  args=[
                      '--no-sandbox', 
                      '--disable-setuid-sandbox',
                      '--disable-blink-features=AutomationControlled'
                  ]
              )
              context = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36',
                  viewport={'width': 1280, 'height': 800},
                  locale='ar-SA',
                  timezone_id='Asia/Riyadh'
              )
              page = context.new_page()
              
              # تفعيل وضع التخفي لتجاوز Cloudflare
              stealth_sync(page)

              if action == 'search':
                  query = os.getenv('QUERY', '')
                  search_url = f'https://animeblkom.net/search?query={urllib.parse.quote(query)}'
                  print(f'=== Stealth Search: {search_url} ===')
                  try:
                      page.goto(search_url, wait_until='networkidle', timeout=60000)
                      page.wait_for_timeout(4000)
                      
                      page_text = page.inner_text('body')
                      if 'cloudflare' in page_text.lower() and 'verify' in page_text.lower():
                          result = 'CF_BLOCKED | ما زالت الحماية تطالب بالتحقق البشري'
                      else:
                          links = []
                          elements = page.query_selector_all('a')
                          for el in elements:
                              href = el.get_attribute('href') or ''
                              text = el.inner_text().strip()
                              # البحث عن الروابط التي تخص تفاصيل الأنمي
                              if href and ('/anime/' in href or '/show/' in href) and len(text) > 1:
                                  parts = [p for p in href.split('/') if p]
                                  if len(parts) >= 2:
                                      slug = parts[-1]
                                      if slug and slug != 'anime':
                                          links.append(f'{slug} | {text}')
                          
                          unique_links = list(dict.fromkeys(links))
                          if unique_links:
                              result = '\n'.join(unique_links[:40])
                          else:
                              result = f'NO_LINKS | Title: {page.title()}'
                  except Exception as e:
                      result = f'ERROR: {str(e)}'

              elif action == 'watch':
                  slug = os.getenv('SLUG', '')
                  episode = os.getenv('EPISODE', '1')
                  watch_url = f'https://animeblkom.net/watch/{slug}/{episode}'
                  print(f'=== Stealth Watch: {watch_url} ===')
                  try:
                      page.goto(watch_url, wait_until='networkidle', timeout=60000)
                      page.wait_for_timeout(4000)
                      content = page.content()
                      
                      bk_links = re.findall(r'https?://[^\s\"\'<>]+bkvideo[^\s\"\'<>]+', content)
                      if not bk_links:
                          bk_links = re.findall(r'https?://[^\s\"\'<>:]+\.mp4[^\s\"\'<>]*', content)
                          
                      unique_streams = list(set(bk_links))
                      if unique_streams:
                          result = '\n'.join(unique_streams)
                      else:
                          result = 'NO_STREAMS_FOUND'
                  except Exception as e:
                      result = f'ERROR: {str(e)}'

              browser.close()

          with open('api_result.txt', 'w', encoding='utf-8') as f:
              f.write(result.strip())
          "

      - name: Commit and Push Result
        run: |
          git config --global user.name 'Anime Bot'
          git config --global user.email 'bot@github.com'
          git add api_result.txt
          git commit -m "Update Stealth API result" || exit 0
          git push
