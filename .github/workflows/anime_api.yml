name: Anime API Engine

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action type (search or watch)'
        required: true
        default: 'search'
      query:
        description: 'Anime name for search'
        required: false
      slug:
        description: 'Anime slug'
        required: false
      episode:
        description: 'Episode number'
        required: false

# أضف هذا الصلاحية هنا 👇 لكي يسمح له بالتعديل والرفع
permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ... باقي الكود كما هو بدون تغيير ...
